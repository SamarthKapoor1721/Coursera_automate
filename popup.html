<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Coursera Speed Boost</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 240px;
        padding: 14px;
        margin: 0;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .speed-value {
        font-size: 28px;
        font-weight: 700;
        text-align: center;
        margin: 4px 0 10px;
      }
      input[type="range"] {
        width: 100%;
      }
      .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      button {
        flex: 1 0 calc(25% - 6px);
        padding: 6px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #f5f5f5;
        cursor: pointer;
        font-size: 12px;
      }
      button.active {
        background: #0056d2;
        color: white;
        border-color: #0056d2;
      }
      .note {
        font-size: 11px;
        color: #666;
        margin-top: 12px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>Coursera Speed Boost</h1>
    <div class="speed-value" id="speedValue">1x</div>
    <input type="range" id="speedSlider" min="1" max="16" step="0.5" value="1" />
    <div class="presets" id="presets"></div>
    <h1 style="margin-top: 14px;">Seek</h1>
    <div class="presets" id="seekPresets"></div>
    <div class="note">Audio auto-mutes above 4x (speech is unintelligible beyond that). Alt+S cycles presets.</div>
  </body>
  <script src="popup.js"></script>
</html>
