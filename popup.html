<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Coursera Skippy</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 240px;
        padding: 14px;
        margin: 0;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .speed-value {
        font-size: 28px;
        font-weight: 700;
        text-align: center;
        margin: 4px 0 10px;
      }
      input[type="range"] {
        width: 100%;
      }
      .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      button.preset-btn {
        flex: 1 0 calc(25% - 6px);
        padding: 6px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #f5f5f5;
        cursor: pointer;
        font-size: 12px;
      }
      button.preset-btn.active {
        background: #0056d2;
        color: white;
        border-color: #0056d2;
      }
      .action-btn {
        width: 100%;
        padding: 8px 0;
        margin-top: 14px;
        border: none;
        border-radius: 6px;
        background: #0056d2;
        color: #fff;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
      }
      .action-btn:hover {
        background: #00419e;
      }
      .advance-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        cursor: pointer;
        font-size: 12px;
      }
      .note {
        font-size: 11px;
        color: #666;
        margin-top: 12px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>Coursera Skippy</h1>
    <div class="speed-value" id="speedValue">1x</div>
    <input type="range" id="speedSlider" min="1" max="16" step="0.5" value="1" />
    <div class="presets" id="presets"></div>
    <h1 style="margin-top: 14px;">Seek</h1>
    <div class="presets" id="seekPresets"></div>
    <button class="action-btn" id="nextItemBtn">⏭ Next Item (Skip)</button>
    <label class="advance-row">
      <input type="checkbox" id="autoAdvanceCheckbox" />
      Auto-advance (Videos & Readings)
    </label>
    <div class="note">Audio auto-mutes above 4x. Alt+S cycles speed. Alt+N advances to next item.</div>
  </body>
  <script src="popup.js"></script>
</html>
